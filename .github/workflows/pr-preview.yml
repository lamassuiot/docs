name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone -- needed to diff
          # against the PR's base branch for the diff-mode toggle below.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PR-preview-only: per-page unified diff of content/docs/**/*.mdx vs the
      # PR's base branch, consumed by the diff-mode toggle (app/lib/pr-diffs.ts).
      # Writes {} (toggle stays hidden everywhere) if this fails for any reason
      # -- see scripts/generate-pr-diffs.mjs.
      - name: Generate PR diff data
        env:
          PR_DIFF_BASE: origin/${{ github.event.pull_request.base.ref }}
          PR_DIFF_HEAD: HEAD
        run: node scripts/generate-pr-diffs.mjs

      # GitHub Pages serves this repo's gh-pages branch under a
      # www.lamassu.io/docs/<branch-path> project-site prefix (this custom
      # domain is shared with another repo's Pages site, which gets the
      # domain root — verified empirically, not documented anywhere in this
      # repo). That /docs/ prefix is added by GitHub outside our control and
      # applies uniformly to every path on the branch, assets included. So
      # what the browser actually requests (Vite's `base`) must include it,
      # even though what we publish to gh-pages (DEST_PREFIX below) doesn't
      # itself contain "docs" — GitHub supplies that part.
      - name: Build preview
        env:
          PREVIEW_BASENAME: /docs/pr-preview/pr-${{ github.event.pull_request.number }}
        run: pnpm build

      # Vite's `base` only rewrites the *references* in HTML/JS to the prefixed
      # path — it doesn't relocate the physical output files, and React
      # Router's `basename` physically nests prerendered pages under a
      # directory matching PREVIEW_BASENAME (SRC_PREFIX below, including the
      # "docs" segment above). Assemble a self-contained bundle at
      # DEST_PREFIX — one level up, without that segment, since GitHub's own
      # project-site prefix will supply it once this is published — combining
      # those prerendered pages with the static assets, which Vite always
      # writes at the build root regardless of `base`.
      - name: Assemble self-contained preview bundle
        run: |
          set -euo pipefail
          SRC_PREFIX="docs/pr-preview/pr-${{ github.event.pull_request.number }}"
          DEST_PREFIX="pr-preview/pr-${{ github.event.pull_request.number }}"
          OUT="publish/$DEST_PREFIX"
          mkdir -p "$OUT"
          cp -r "build/client/$SRC_PREFIX/." "$OUT/"
          cp -r build/client/assets "$OUT/assets"
          cp -r build/client/images "$OUT/images"
          cp build/client/favicon.svg build/client/t.svg "$OUT/"

      # Publish additively into the shared gh-pages branch, under a path
      # ("pr-preview/pr-<n>/") that doesn't collide with anything else
      # currently on that branch. Only that one subdirectory is touched.
      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          PREFIX="pr-preview/pr-${{ github.event.pull_request.number }}"
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          cd /tmp/gh-pages
          git checkout -B gh-pages

          for attempt in 1 2 3 4 5; do
            rm -rf "$PREFIX"
            mkdir -p "$PREFIX"
            cp -r "$GITHUB_WORKSPACE/publish/$PREFIX/." "$PREFIX/"
            git add "$PREFIX"
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Preview for PR #${{ github.event.pull_request.number }}" --quiet || {
              echo "Nothing changed, nothing to publish."
              break
            }
            if git push origin gh-pages; then
              break
            fi
            echo "Push rejected (concurrent preview build?), retrying ($attempt/5)..."
            git reset --soft HEAD~1
            git fetch origin gh-pages
            git checkout -B gh-pages origin/gh-pages
          done

      - name: Comment preview link on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR=${{ github.event.pull_request.number }}
          URL="https://www.lamassu.io/docs/pr-preview/pr-$PR/docs/"
          MARKER="<!-- pr-preview-link -->"
          BODY="$(cat <<EOF
          $MARKER
          📖 **Preview:** $URL

          Rebuilt on every push to this PR. May take a minute to appear after GitHub Pages picks up the \`gh-pages\` commit.
          EOF
          )"
          existing=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -1)
          if [ -n "$existing" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$existing" -X PATCH -f body="$BODY"
          else
            gh pr comment "$PR" --body "$BODY"
          fi
