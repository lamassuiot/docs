<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lamassu EST enrollment: dashboard and device terminal</title>
<style>
  :root { --bar: #1e2430; --bar-text: #e8ecf4; --accent: #405fff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #111; font-family: system-ui, sans-serif; }
  main { display: flex; height: 100vh; }
  section { display: flex; flex-direction: column; min-width: 0; transition: none; }
  #dash-pane { flex: 0 0 60%; }
  #term-pane { flex: 0 0 40%; }
  body[data-focus="terminal"] #dash-pane { display: none; }
  body[data-focus="terminal"] #term-pane { flex-basis: 100%; }
  body[data-focus="dashboard"] #term-pane { display: none; }
  body[data-focus="dashboard"] #dash-pane { flex-basis: 100%; }
  header { height: 34px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px;
           background: var(--bar); color: var(--bar-text); font-size: 13px; }
  header .tag { font-weight: 600; }
  header .role { opacity: .75; }
  header .spacer { flex: 1; }
  header button { font: inherit; font-size: 12px; color: var(--bar-text); background: transparent;
                  border: 1px solid #56607a; border-radius: 4px; padding: 2px 10px; cursor: pointer; }
  header button:hover { background: #2c3446; }
  #term-pane header { border-left: 1px solid #000; }
  iframe { flex: 1; width: 100%; border: 0; background: #fff; }
</style>
</head>
<body data-focus="both">
<main>
  <section id="dash-pane">
    <header>
      <span class="tag">Lamassu dashboard</span><span class="role">Administrator: DMS and inventory</span>
      <span class="spacer"></span>
      <button id="dash-toggle" type="button">Expand</button>
    </header>
    <iframe id="dashboard" title="Lamassu dashboard"></iframe>
  </section>
  <section id="term-pane">
    <header>
      <span class="tag">Device terminal</span><span class="role">EST client</span>
      <span class="spacer"></span>
      <button id="term-toggle" type="button">Expand</button>
    </header>
    <iframe id="terminal" title="Device terminal" allow="clipboard-read; clipboard-write"></iframe>
  </section>
</main>
<script>
  // Both applications are loaded unchanged in iframes; only their size changes
  // (display:none keeps their sessions alive). URLs come from the query string
  // because the dashboard port is assigned at runtime.
  var q = new URLSearchParams(location.search);
  document.getElementById('dashboard').src = q.get('dashboard') || 'http://localhost:8085/';
  document.getElementById('terminal').src = q.get('terminal') || 'http://localhost:8088/';
  function setFocus(v) {
    document.body.dataset.focus = v;
    document.getElementById('dash-toggle').textContent = v === 'dashboard' ? 'Restore' : 'Expand';
    document.getElementById('term-toggle').textContent = v === 'terminal' ? 'Restore' : 'Expand';
  }
  document.getElementById('dash-toggle').onclick = function () { setFocus(document.body.dataset.focus === 'dashboard' ? 'both' : 'dashboard'); };
  document.getElementById('term-toggle').onclick = function () { setFocus(document.body.dataset.focus === 'terminal' ? 'both' : 'terminal'); };
</script>
</body>
</html>
