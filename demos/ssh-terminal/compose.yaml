services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:8088:80"
    restart: on-failure
    depends_on:
      proxy:
        condition: service_healthy
      terminal:
        condition: service_started
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "5555"]
      interval: 1s
      timeout: 2s
      retries: 30
    depends_on:
      - terminal
  terminal:
    build:
      context: .
      dockerfile: Dockerfile.terminal
    hostname: lamassu-demo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./files:/home/demo/files
