function prepEdge(e) {
  e.len = [0];
  for (let i = 1; i < e.sp.length; i++) e.len.push(e.len[i - 1] + Math.hypot(e.sp[i][0] - e.sp[i - 1][0], e.sp[i][1] - e.sp[i - 1][1]));
  e.total = e.len[e.len.length - 1];
  e.vis = e.sp.slice(0, e.draw ? e.draw + 1 : e.sp.length);
}
function pointAt(e, d) {
  d = clamp(d, 0, e.total);
  for (let i = 1; i < e.sp.length; i++) if (d <= e.len[i] || i === e.sp.length - 1) {
    const s = e.len[i] - e.len[i - 1] || 1, u = (d - e.len[i - 1]) / s, a = e.sp[i - 1], b = e.sp[i];
    return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, i - 1];
  }
  const l = e.sp[e.sp.length - 1]; return [l[0], l[1], e.sp.length - 2];
}
function strokeRange(e, d0, d1) {
  g.beginPath(); const a = pointAt(e, d0); g.moveTo(a[0], a[1]);
  for (let i = 1; i < e.sp.length; i++) if (e.len[i] > d0 && e.len[i] < d1) g.lineTo(e.sp[i][0], e.sp[i][1]);
  const b = pointAt(e, d1); g.lineTo(b[0], b[1]); g.stroke();
}
function drawPacket(kind, x, y, a, ang) {

  } else if (kind === 'db') circ(x, y, 2.6, C.g5);

    if (!A.f.rev) strokeRange(e, 0, e.total * A.p); else strokeRange(e, e.total * (1 - A.p), e.total);
    g.globalAlpha = 1;

  }
}
function drawPackets(V, fs, alphaMul = 1) {
  for (const A of fs.active) {

}

  if (id === 'rabbit') { edges.add('bus'); for (const m of META_LIST) { const e = META[m[0]]; if (e.type === 'event' && allowed.includes(e.cls)) { edges.add(e.id); nodes.add(e.from); } } }
  return { nodes, edges };
}
function frameState(t, lv) {
  const st = stateAt(t), focusId = (ST.m === 0 || ST.m === 1) ? (pinned || hover) : null;
  let FN = null, FE = null, dimN = 1, dimE = 1;
  if (focusId) { const a = adjacency(focusId, lv); FN = a.nodes; FE = a.edges; dimN = 0.32; dimE = 0.1; }
  else if (st.spot) {
    const k = smooth((t - st.t0) / 0.5) * smooth((st.t1 - t) / 0.5);
    FN = new Set(st.spot); FE = new Set(st.edges);
    for (const id of st.edges) if (MAP[id]) FE.add(MAP[id]);
    if (st.spot.some(id => NATIVE.has(id))) FN.add('lamassu');
    dimN = 1 - 0.42 * k; dimE = 1 - 0.55 * k;
  }
  const pulse = {}, glow = {}, active = [];
  for (const f of FLOWS) {
    const end = f.t0 + f.dur, eid = lv < 0.5 ? f.e : (f.e in MAP ? MAP[f.e] : f.e);
    if (t >= f.t0 && t <= end) { if (eid) { active.push({ f, eid, p: flowEase((t - f.t0) / f.dur) }); glow[eid] = 1; } }
    else if (t > end && t < end + 0.9) { const k = 1 - (t - end) / 0.9; pulse[f.arrive] = Math.max(pulse[f.arrive] || 0, k); if (eid) glow[eid] = Math.max(glow[eid] || 0, k * 0.8); }
    if (t >= f.t0 - 0.05 && t < f.t0 + 0.3) pulse[f.src] = Math.max(pulse[f.src] || 0, 0.5);
  }
  const rp = clamp(1 - Math.abs(t - RABBIT_FANOUT - 0.05) / 0.55);
  pulse.rabbit = Math.max(pulse.rabbit || 0, rp);
  let lp = 0; for (const id of NATIVE) lp = Math.max(lp, pulse[id] || 0); pulse.lamassu = lp * boxF(lv);
  const busAct = Math.max(glow.ev_ca || 0, glow.ev_va || 0, glow.ev_aws || 0, rp);
  const eA = id => (!FE || FE.has(id)) ? 1 : dimE;
  const fs = {
    t, lv, st, focusId, FN, FE, dimN, dimE, pulse, glow, active, busAct,
    nA: id => (!FN || FN.has(id)) ? 1 : dimN,
    edgeAlpha: id => {
      const m = META[id], la = levelAlpha(m.cls, lv); if (la <= 0.005) return 0;
      if (m.hidden) { const show = (focusId && FE && FE.has(id)) ? 1 : (glow[id] || 0); return show * 0.9 * la; }
      return eA(id) * la;
    }
  };
  return fs;
}

// ---- 2D <-> 3D morph frame
function morphFrame(e, fs) {
  const lv = fs.lv;
  g.globalAlpha = 1 - e; g.drawImage(layers['2d'].grid, 0, 0, LW, LH);
  g.globalAlpha = e; g.drawImage(layers['3d'].grid, 0, 0, LW, LH);
  g.globalAlpha = 1;
  // zones glide between rectangles and isometric parallelograms
  for (const z of V2.ZONES) {
    if (z.id === 'crypto' && lv >= 0.99) continue;
    const c2 = V2.zoneCorners(z.id), c3 = V3.zoneCorners(z.id), pts = c2.map((p, i) => lerp2(p, c3[i], e));
    const za = z.id === 'crypto' ? 1 - lv : 1;
    V2.zoneDraw(z.id, pts, (1 - e) * za); V3.zoneDraw(z.id, pts, e * za);
  }
  const b = boxF(lv);
  if (b > 0.01) {
    const c2 = V2.boxCorners(b), c3 = V3.boxCorners(b), pts = c2.map((p, i) => lerp2(p, c3[i], e));
    g.globalAlpha = b; poly(pts, C.P, C.b9, 1.4); g.globalAlpha = 1;
  }
  // routed links of the source/target views fade at the ends; rubber bands carry the topology in flight
  const a2 = clamp(1 - e / 0.28), a3 = clamp((e - 0.72) / 0.28);
  for (const [V, a] of [[V2, a2], [V3, a3]]) {
    if (a <= 0.01) continue;
    for (const ed of V.ELIST) { const al = fs.edgeAlpha(ed.id) * a; if (al > 0.01) V.drawEdge(ed, al); }
  }
  const pos = id => { const p2 = V2.anchor(id), p3 = V3.anchor(id); return lerp2(p2, p3, e); };
  const band = Math.sin(Math.PI * e);
  if (band > 0.02) {
    g.lineCap = 'round';
    for (const m of META_LIST) {
      const ed = META[m[0]]; if (ed.hidden || !V2.N[ed.to] || !V2.N[ed.from]) continue;
      const la = levelAlpha(ed.cls, lv); if (la < 0.3) continue;
      const p = pos(ed.from), q = pos(ed.to);
      g.globalAlpha = 0.55 * band * la; g.strokeStyle = STY[ed.type].c; g.lineWidth = 1.2; g.setLineDash(STY[ed.type].dash || []);
      g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); g.stroke(); g.setLineDash([]);
    }
    g.globalAlpha = 1;
  }
  // nodes: flat cards travel and fade out, isometric objects travel and rise in
  const ids = Object.keys(V2.N).filter(id => !V2.N[id].box);
  const f2 = 1 - smooth((e - 0.25) / 0.45), f3 = smooth((e - 0.3) / 0.45), rise = lerp(0.35, 1, smooth((e - 0.35) / 0.65));
  if (f2 > 0.01) for (const id of ids) { const p = pos(id), a = V2.anchor(id); V2.drawNodeAt(id, p[0] - a[0], p[1] - a[1], f2 * fs.nA(id), fs, lerp(1, 0.72, e)); }
  if (f3 > 0.01) {
    const order = ids.slice().sort((p, q) => V3.depth(p) - V3.depth(q));
    for (const id of order) { const p = pos(id), a = V3.anchor(id); V3.drawNodeAt(id, p[0] - a[0], p[1] - a[1], f3 * fs.nA(id), fs, rise); }
  }
}

function drawHUD(t, st, sub) {
  text('LAMASSU PKI', 34, 38, { size: 10, w: 700, fam: MONO, col: C.P, ls: 2.2 });
  text('Kubernetes deployment architecture', 34, 62, { size: 19, w: 650, col: C.text });
  text(sub, 34, 84, { size: 11, w: 450, col: C.g5 });
  // legend
  const lx = 20, ly = 700, lw = 204, lh = 176;
  rr(lx + 1, ly + 2, lw, lh, 5); g.fillStyle = `${C.shadow}0.06)`; g.fill();
  rr(lx, ly, lw, lh, 5); g.fillStyle = rgba(C.w, 0.95); g.fill(); g.strokeStyle = `${C.border}0.2)`; g.lineWidth = 1; g.stroke();
  text('CONNECTION LANGUAGE', lx + 12, ly + 16, { size: 8.2, w: 700, fam: MONO, col: C.g5, ls: 1.1 });
  const rows = [['http', 'Synchronous HTTP'], ['event', 'AMQP / CloudEvents'], ['auth', 'AuthN / AuthZ · JWKS'], ['key', 'Key operation'], ['infra', 'Infrastructure'], ['db', 'Persistence (on focus)']];
  rows.forEach(([k, label], i) => {
    const yy = ly + 36 + i * 17, s2 = STY[k];
    g.setLineDash(s2.dash || []); line(lx + 12, yy, lx + 44, yy, s2.c, s2.w + 0.2); g.setLineDash([]);
    if (k !== 'infra' && k !== 'db') drawPacket(k, lx + 28, yy, 1, 0);
    text(label, lx + 54, yy + 0.5, { size: 10.3, col: C.text });
  });
  text('Hover to trace · click to pin', lx + 12, ly + lh - 24, { size: 9.3, w: 450, col: C.g5 });
  text(ST.lock ? 'Key: V view' : 'Keys: V view · L level', lx + 12, ly + lh - 11, { size: 9, w: 450, col: C.g4 });
  // step card
  const sw = 410, sh = 62, sx = LW - sw - 30, sy = 26;
  rr(sx + 1, sy + 2, sw, sh, 5); g.fillStyle = `${C.shadow}0.06)`; g.fill();
  rr(sx, sy, sw, sh, 5); g.fillStyle = rgba(C.w, 0.96); g.fill(); g.strokeStyle = `${C.border}0.2)`; g.stroke();
  text(st.n + ' / 07', sx + 14, sy + 17, { size: 10, w: 700, fam: MONO, col: C.P });
  text(st.title, sx + 70, sy + 17, { size: 12.5, w: 650, col: C.text });
  text(st.sub, sx + 14, sy + 35, { size: 10, w: 450, col: C.g6 });
  const segW = (sw - 28 - 24) / 7;
  STATES.forEach((s2, i) => {
    const x = sx + 14 + i * (segW + 4), y = sy + 48;
    rr(x, y, segW, 3, 1.5); g.fillStyle = C.b1; g.fill();
    const p = clamp((t - s2.t0) / (s2.t1 - s2.t0));
    if (p > 0) { rr(x, y, Math.max(3, segW * p), 3, 1.5); g.fillStyle = s2 === st ? C.P : C.b3; g.fill(); }
  });
  if (!ST.lock) drawSegmented(CTL.level, easeIO(ST.lv));
  drawSegmented(CTL.view, easeIO(ST.m));
}

function drawTooltip(V, id) {
  const lines = DESC[id] || [], name = id === 'lamassu' ? 'Lamassu PKI Platform' : (V.N[id].name);
  font(11.5, 650); let w = g.measureText(name).width;
  font(10.5, 450); for (const l of lines) w = Math.max(w, g.measureText(l).width);
  w = Math.ceil(w) + 26; const h = 30 + lines.length * 15;
  const mp = mouse || V.anchor(id);
  let ref = id === 'lamassu' || !V.tipAnchor(id) ? { x: mp[0] - 1, y: mp[1] - 8, w: 2, h: 2 } : V.tipAnchor(id);
  let x = ref.x + ref.w / 2 - w / 2, y = ref.y - h - 10;
  if (y < 100) y = ref.y + ref.h + 12;
  x = clamp(x, 10, LW - w - 10); y = clamp(y, 10, LH - h - 10);
  rr(x + 1.5, y + 2.5, w, h, 5); g.fillStyle = `${C.shadow}0.1)`; g.fill();
  rr(x, y, w, h, 5); g.fillStyle = C.w; g.fill(); g.strokeStyle = rgba(C.P, 0.45); g.lineWidth = 1; g.stroke();
  g.fillStyle = CAT[CATS[id]] || C.P; g.fillRect(x, y + 6, 2.5, h - 12);
  text(name, x + 13, y + 16, { size: 11.5, w: 650, col: C.text });
  lines.forEach((l, i) => text(l, x + 13, y + 34 + i * 15, { size: 10.5, w: 450, col: C.g6 }));
}

// ---- input
const toLogical = ev => [(ev.clientX - offX) / S, (ev.clientY - offY) / S];
const settled = () => (ST.m === 0 || ST.m === 1);
const curView = () => ST.m >= 0.5 ? V3 : V2;
function pointer(mx, my, click) {
  if (!ST.lock && inCtl(CTL.level, mx, my)) { if (click) setLevel(mx < CTL.level.x + CTL.level.w / 2 && mx >= CTL.level.x ? 'low' : mx >= CTL.level.x + CTL.level.w / 2 ? 'medium' : (ST.level === 'low' ? 'medium' : 'low')); return 'ctl'; }
  if (inCtl(CTL.view, mx, my)) { if (click) setMode(mx < CTL.view.x + CTL.view.w / 2 && mx >= CTL.view.x ? '2d' : mx >= CTL.view.x + CTL.view.w / 2 ? '3d' : (ST.mode === '3d' ? '2d' : '3d')); return 'ctl'; }
  if (!settled()) return null;
  const n = curView().hit(mx, my, ST.lv);
  return n ? n.id : null;
}
view.addEventListener('mousemove', ev => { mouse = toLogical(ev); const r = pointer(mouse[0], mouse[1], false); hover = r && r !== 'ctl' ? r : null; view.style.cursor = r ? 'pointer' : 'default'; });
view.addEventListener('mouseleave', () => { hover = null; mouse = null; });
view.addEventListener('click', ev => { const [mx, my] = toLogical(ev); mouse = [mx, my]; const r = pointer(mx, my, true); if (r === 'ctl') return; pinned = r ? (pinned === r ? null : r) : null; });
view.addEventListener('touchstart', ev => { const t = ev.touches[0]; if (!t) return; const [mx, my] = toLogical(t); mouse = [mx, my]; const r = pointer(mx, my, true); if (r !== 'ctl') pinned = r; }, { passive: true });
window.addEventListener('keydown', ev => {
  const k = (ev.key || '').toLowerCase();
  if (k === 'v') setMode(ST.mode === '3d' ? '2d' : '3d');
  else if (k === '2') setMode('2d'); else if (k === '3') setMode('3d');
  else if (k === 'l' && !ST.lock) setLevel(ST.level === 'low' ? 'medium' : 'low');
  else if (k === 'f') toggleFullscreen();
});

// ---- fullscreen (cross-browser: iOS Safari 16.4+ and older Android WebViews
// only expose the webkit-prefixed Fullscreen API, not the unprefixed one)
const fsBtn = document.getElementById('fs-btn');
const FS_EXPAND = fsBtn.innerHTML;
const FS_COMPRESS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v3a2 2 0 0 1-2 2H4M15 3v3a2 2 0 0 0 2 2h3M9 21v-3a2 2 0 0 0-2-2H4M15 21v-3a2 2 0 0 1 2-2h3"/></svg>';
const fsEnabled = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled || document.mozFullScreenEnabled || document.msFullscreenEnabled);
const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
function toggleFullscreen() {
  if (fsElement()) {
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
    if (exit) { const r = exit.call(document); if (r && r.catch) r.catch(() => {}); }
  } else {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req) { const r = req.call(el); if (r && r.catch) r.catch(() => {}); }
  }
}
function updateFsBtn() {
  const active = !!fsElement();
  fsBtn.innerHTML = active ? FS_COMPRESS : FS_EXPAND;
  const label = active ? 'Exit fullscreen' : 'Enter fullscreen';
  fsBtn.setAttribute('aria-label', label);
  fsBtn.title = label + ' (F)';
}
fsBtn.addEventListener('click', toggleFullscreen);
['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
  document.addEventListener(evt, () => { updateFsBtn(); resize(); });
});
if (!fsEnabled) fsBtn.style.display = 'none';

// ---- frame loop
const start = performance.now();
let freeze = null, last = performance.now();
const readHash = () => { const m = /t=([\d.]+)/.exec(location.hash); freeze = m ? parseFloat(m[1]) : null; };
readHash(); window.addEventListener('hashchange', readHash);
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const tm = ST.mode === '3d' ? 1 : 0, tl = ST.level === 'medium' ? 1 : 0;
  ST.m = tm > ST.m ? Math.min(tm, ST.m + dt / 1.15) : Math.max(tm, ST.m - dt / 1.15);
  ST.lv = tl > ST.lv ? Math.min(tl, ST.lv + dt / 0.95) : Math.max(tl, ST.lv - dt / 0.95);
  const T = freeze !== null ? freeze : (now - start) / 1000, t = T % LOOP;
  const fs = frameState(t, ST.lv);

  g = sctx;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, scene.width, scene.height);
  if (ST.m === 0 || ST.m === 1) {
    const V = ST.m === 1 ? V3 : V2, Lr = layers[V.id];
    g.drawImage(Lr.grid, 0, 0); g.drawImage(Lr.zones, 0, 0);
    g.setTransform(S * DPR, 0, 0, S * DPR, 0, 0);
    V.frame(fs);
    drawHUD(t, fs.st, V.sub);
    const tip = hover || pinned; if (tip && V.N[tip]) drawTooltip(V, tip);
  } else {
    g.setTransform(S * DPR, 0, 0, S * DPR, 0, 0);
    const e = easeIO(ST.m);
    morphFrame(e, fs);
    drawHUD(t, fs.st, e < 0.5 ? V2.sub : V3.sub);
  }
  vctx.setTransform(1, 0, 0, 1, 0, 0);
  vctx.fillStyle = C.bg; vctx.fillRect(0, 0, view.width, view.height);
  vctx.drawImage(scene, Math.round(offX * DPR), Math.round(offY * DPR));
  requestAnimationFrame(frame);
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  const w = window.innerWidth, h = window.innerHeight;
  view.width = Math.round(w * DPR); view.height = Math.round(h * DPR);
  S = Math.min(w / LW, h / LH); offX = (w - LW * S) / 2; offY = (h - LH * S) / 2;
  scene.width = Math.round(LW * S * DPR); scene.height = Math.round(LH * S * DPR);
  for (const [id, V] of [['3d', V3], ['2d', V2]]) {
    for (const k of ['grid', 'zones']) { const c = layers[id][k]; c.width = scene.width; c.height = scene.height; }
    g = layers[id].grid.getContext('2d'); g.setTransform(S * DPR, 0, 0, S * DPR, 0, 0); V.renderGrid();
    g = layers[id].zones.getContext('2d'); g.setTransform(S * DPR, 0, 0, S * DPR, 0, 0); g.clearRect(0, 0, LW, LH); V.renderZones();
  }
  g = sctx;
}
resize();
window.addEventListener('resize', resize);
requestAnimationFrame(frame);
})();
</script>
