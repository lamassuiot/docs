<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La confianza en la PKI de Lamassu</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #ffffff;
      --ink: #171718;
      --muted: #55565e;
      --rule: #e3e3e8;
      --accent: #0100f8;
      --font-sans: "Inter", system-ui, sans-serif;
      --font-mono: "Geist Mono", ui-monospace, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      color: var(--ink);
      background: var(--paper);
      font-family: var(--font-sans);
      margin: 0;
    }

    main {
      max-width: 1080px;
      margin-inline: auto;
      padding: clamp(1rem, 4vw, 2.5rem);
    }

    header {
      border-block-start: 2px solid var(--accent);
      border-block-end: 1px solid var(--rule);
      padding-block: 1.15rem 1rem;
    }

    h1 {
      font-size: clamp(1.75rem, 4vw, 2.6rem);
      font-weight: 650;
      letter-spacing: -.045em;
      line-height: 1.1;
      margin: 0;
    }

    header p {
      color: var(--muted);
      line-height: 1.5;
      margin: .55rem 0 0;
    }

    figure { margin: 0; }
    .diagram { max-width: 100%; overflow-x: auto; }
    .diagram:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    svg { display: block; width: 100%; min-width: 1000px; }
    .paper { fill: var(--paper); }
    .diagram--compact { display: none; }

    @media (max-width: 860px) {
      .diagram--wide { display: none; }
      .diagram--compact { display: block; }
      .diagram--compact svg { max-width: 520px; min-width: 0; margin-inline: auto; }
    }

    .trace { stroke: #aaaab6; stroke-width: 1; stroke-dasharray: 4 5; }
    .layer {
      --top: #fff;
      --left: #efeff1;
      --right: #dfdfe5;
      --edge: #30303a;
      --detail: #747483;
      --sheet: #fff;
      --back-sheet: #ececf0;
      --channel: #f9f9fa;
      --token: #30303a;
    }
    .layer[data-focal] {
      --top: #f2f2ff;
      --left: #e1e1ff;
      --right: #ceceff;
      --edge: #2929d7;
      --detail: #5b5ba1;
      --sheet: #fff;
      --channel: #e9e9ff;
      --token: var(--accent);
    }
    .slab-top { fill: var(--top); }
    .slab-left { fill: var(--left); }
    .slab-right { fill: var(--right); }
    .slab-outline, .slab-rim { fill: none; stroke: var(--edge); }
    .slab-outline { stroke-width: 1.3; stroke-linejoin: round; }
    .slab-rim { stroke-width: .85; opacity: .62; }
    .surface-art { stroke-linecap: round; stroke-linejoin: round; }

    .inset { fill: var(--channel); stroke: var(--detail); stroke-width: .85; }
    .sheet, .back-sheet { stroke: var(--edge); stroke-width: 1.1; }
    .sheet { fill: var(--sheet); }
    .back-sheet { fill: var(--back-sheet); }
    .detail, .strong { fill: none; }
    .detail { stroke: var(--detail); stroke-width: 1.5; }
    .strong { stroke: var(--edge); stroke-width: 2; }
    .ink-token { fill: var(--token); }
    .token-check { fill: none; stroke: var(--paper); stroke-width: 1.9; }
    .module, .module-depth { stroke: var(--edge); stroke-width: 1.25; }
    .module { fill: #e8e8ed; }
    .module-depth { fill: #b0b0bc; }
    .module-inset { fill: #fbfbfc; stroke: var(--detail); stroke-width: .85; }

    .leader { stroke: #a0a0ac; stroke-width: 1; }
    .leader-dot { fill: var(--edge); }
    .part-name { fill: var(--ink); font: 650 20px var(--font-sans); }
    .part-detail { fill: var(--muted); font: 14px var(--font-sans); }
    [data-focal] .leader { stroke: var(--edge); }
    [data-focal] .part-detail { fill: #2424bc; }
    .diagram--compact .part-name { font-size: 14px; }
    .diagram--compact .part-detail { font-size: 11px; }

    .status-box { fill: #fafafb; stroke: #bdbdc7; }
    .status-line { stroke: #91919f; stroke-dasharray: 3 3; }
    .status-name { fill: var(--ink); font: 600 12px var(--font-mono); }
    .status-detail { fill: var(--muted); font: 11px var(--font-sans); }

    figcaption {
      color: var(--muted);
      border-block-start: 1px solid var(--rule);
      padding-block-start: 1rem;
      font-size: .92rem;
      line-height: 1.6;
    }

    details { margin-block-start: .65rem; }
    summary { color: var(--ink); cursor: pointer; }
    dl { max-width: 65ch; }
    dt { color: var(--ink); font-weight: 650; }
    dd { margin: 0 0 .75rem; }

    @media print {
      main { padding: 0; }
      .diagram { overflow: visible; }
      .diagram--wide { display: block; }
      .diagram--compact { display: none; }
      svg { min-width: 0; }
      details { display: none; }
    }
  </style>
</head>

      <figcaption>
        Lamassu emite el certificado y publica su estado. El servicio consumidor aplica su propia política para decidir si lo acepta.
        <details>
          <summary>Descripción de las cinco capas</summary>
          <dl>
            <dt>Custodia de claves</dt>
            <dd>El KMS delega la custodia o la operación de firma de la CA en el motor criptográfico configurado.</dd>
            <dt>Autoridades de certificación</dt>
            <dd>En esta jerarquía de ejemplo, la raíz firma el certificado de la CA intermedia, que emite el certificado del cliente.</dd>
            <dt>Política y emisión</dt>
            <dd>La solicitud de firma (CSR) contiene la clave pública. El perfil define las reglas de identidad, vigencia y uso. La CA aplica el perfil y firma el certificado.</dd>
            <dt>Identidad del cliente</dt>
            <dd>El cliente presenta su certificado X.509 y el de la CA intermedia. Si generó la solicitud localmente, la clave privada queda en el cliente.</dd>
            <dt>Verificación en el consumidor</dt>
            <dd>El servicio consumidor ancla la cadena en la raíz que configuró y comprueba la identidad, las fechas, los usos y el estado de revocación. Lamassu publica ese estado mediante OCSP y CRL.</dd>
          </dl>
        </details>
      </figcaption>
